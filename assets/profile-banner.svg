    <circle cx="848" cy="104" r="4"><animate attributeName="r" values="4;8;4" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="943" cy="261" r="4"><animate attributeName="r" values="4;7;4" dur="3.3s" repeatCount="indefinite"/></circle>
